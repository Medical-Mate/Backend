name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 같은 브랜치에 연속으로 푸시하면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 21 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Gradle 설정 및 캐시
        uses: gradle/actions/setup-gradle@v4

      # 컴파일이 곧 타입 검사이고, build 에 test 가 포함된다.
      - name: 빌드와 테스트
        run: ./gradlew build --no-daemon

      # 로그만으로 원인을 찾기 어려운 실패가 있어 리포트를 남긴다.
      - name: 실패 시 테스트 리포트 업로드
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  commit-message:
    name: commit-message
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      # 커밋 이력을 비교해야 하므로 전체를 받는다.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 커밋 메시지 규칙 검사
        run: |
          .github/scripts/check-commit-messages.sh \
            "${{ github.event.pull_request.base.sha }}" \
            "${{ github.event.pull_request.head.sha }}"
