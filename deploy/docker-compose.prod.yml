# 운영 구성. Lightsail 인스턴스 한 대에 전부 올린다.
#
# 이미지는 여기서 빌드하지 않는다. 2GB 서버에서 Gradle 을 돌리면 OOM 으로 죽는다.
# GitHub Actions 가 GHCR 에 올린 것을 pull 만 한다.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 비밀값은 같은 디렉터리의 .env 에서 읽는다. 그 파일은 커밋되지 않는다.
name: jinryomate

services:
  # ---------- 진입점 ----------
  # 인터넷에 열리는 유일한 컨테이너다. TLS 를 여기서 끝내고 뒤로는 평문으로 넘긴다.
  # 인증서는 Caddy 가 Let's Encrypt 에서 자동 발급·갱신한다.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     # ACME 인증과 HTTPS 리다이렉트에 필요하다. 닫으면 인증서 발급이 실패한다.
      - "443:443"
    environment:
      # 예: 1-2-3-4.sslip.io — 그 IP 로 해석되는 공개 호스트명이다.
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST 가 필요합니다}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # 발급받은 인증서. 지우면 재발급 한도에 걸릴 수 있다.
      - caddy-config:/config
    mem_limit: 64m
    depends_on:
      - backend

  # ---------- 백엔드 ----------
  backend:
    image: ghcr.io/medical-mate/backend:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-jinryomate}
      DB_USERNAME: ${POSTGRES_USER:-jinryomate}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요합니다}

      # 앱 ID 가 없으면 서버가 아예 뜨지 않는다 — 남의 앱 토큰을 걸러내는 방어선이다.
      KAKAO_APP_ID: ${KAKAO_APP_ID:?KAKAO_APP_ID 가 필요합니다}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}

      # 같은 Docker 네트워크 안이라 컨테이너 이름으로 부른다. 인터넷을 타지 않는다.
      AI_BASE_URL: http://ai:8000
      # 양쪽이 같은 값이어야 한다. 비어 있으면 백엔드가 스텁으로 돌고 AI 는 서명 검증을
      # 끈 채 뜬다 — 붙는 시늉을 하다 401 로 터지는 것보다 낫지만, 운영에서는 채워야 한다.
      MEDIMATE_HMAC_SECRET: ${MEDIMATE_HMAC_SECRET:-}

      # 심평원 병원정보서비스. 발급받은 문자열을 그대로 넣는다 — 디코딩해서 넣으면
      # 인증은 통과한 것처럼 보이는데 결과가 0건으로 온다(오류 메시지도 없다).
      # 비어 있으면 백엔드가 고정 목록으로 돈다.
      HIRA_SERVICE_KEY: ${HIRA_SERVICE_KEY:-}

      # Dockerfile 의 -XX:MaxRAMPercentage 는 컨테이너가 여럿이면 계산이 어긋난다.
      # -Xmx 를 명시하면 MaxRAMPercentage 는 무시된다.
      JAVA_TOOL_OPTIONS: "-Xmx320m -XX:MaxMetaspaceSize=128m"
    mem_limit: 640m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s   # 콜드 스타트가 느리다. 짧게 잡으면 기동 중에 unhealthy 가 된다.

  # ---------- AI ----------
  # 모델 가중치를 들고 있지 않아 GPU 가 필요 없다. 무상태라 볼륨도 DB 도 없다 —
  # 세션 상태는 백엔드가 들고 다닌다.
  #
  # 포트를 열지 않는다. 백엔드만 내부망으로 접근한다.
  #
  # AI 이미지가 준비되기 전에는 띄우지 않아도 된다. 백엔드가 StubAiCardClient 로 동작한다.
  ai:
    image: ${AI_IMAGE:-ghcr.io/medical-mate/ai:latest}
    restart: unless-stopped
    environment:
      # Langfuse 트레이싱(AI#127). 명시 목록이라 .env 에만 넣으면 컨테이너에 안 들어간다.
      # 키가 비면 SDK 가 무동작이다.
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
      MEDIMATE_ENV: ${MEDIMATE_ENV:-}

      # 본문 수집. on 이면 증상 본문이 Langfuse(미국, ClickHouse, Inc.)로 나간다 — 비우면
      # 길이만 남긴다. 웹 국외 이전 안내에 미국·ClickHouse 가 올라간 뒤(Web-App c2d4d68,
      # 2026-09-23 배포)인 2026-09-28 에 켰다(AI#111 · #127). 안내문대로 2027-01-15 에
      # Langfuse 기록도 함께 지운다. 켜졌는지는 /health.tracing.content 로 본다.
      MEDIMATE_TRACE_CONTENT: ${MEDIMATE_TRACE_CONTENT:-}

      # 트레이스 본문 식별자 가림(AI #131). 비우면 정규식만 — 이름이 그대로 Langfuse로 간다.
      # 이름·주소·나이는 Bedrock Guardrails(서울)로 찾는다. 카드·모델 입력에는 쓰지 않고
      # 트레이스로 나가는 본문에만 쓴다. 가드레일 id 는 비밀값이 아니다.
      # 켜졌는지는 /health.tracing.pii 가 "guardrails" 인지로 본다("regex"면 이 두 줄이 빠진 것).
      MEDIMATE_TRACE_PII_GUARDRAIL: ${MEDIMATE_TRACE_PII_GUARDRAIL:-}
      MEDIMATE_TRACE_PII_GUARDRAIL_VERSION: ${MEDIMATE_TRACE_PII_GUARDRAIL_VERSION:-1}
      # 요청 서명 검증. 비우면 AI 가 검증을 통째로 생략한다.
      MEDIMATE_HMAC_SECRET: ${MEDIMATE_HMAC_SECRET:-}

      # 시크릿이 비면 기동을 실패시킨다.
      #
      # 실제로 한 번 당했다. 시크릿을 빈 채로 배포해 놓고 무검증으로 몇 시간을 돌았는데,
      # 서명 없는 요청을 직접 던져 보기 전까지 아무도 몰랐다. AI 쪽이 기동 경고를
      # 붙여 줬지만 컨테이너 로그를 매번 보지는 않는다.
      #
      # KAKAO_APP_ID 가 없으면 백엔드 기동을 막는 것과 같은 이유다 — 방어선이 조용히
      # 꺼진 채로 멀쩡히 도는 상태를 만들지 않는다.
      MEDIMATE_REQUIRE_HMAC: ${MEDIMATE_REQUIRE_HMAC:-1}

      # Bedrock Nova Pro 를 쓴다. OpenAI 키는 더 이상 필요 없다.
      MEDIMATE_PROVIDER: ${MEDIMATE_PROVIDER:-bedrock}
      MEDIMATE_MODEL: ${MEDIMATE_MODEL:-apac.amazon.nova-pro-v1:0}

      # 하루에 LLM 에 쓸 수 있는 상한(USD). 도달하면 LLM 을 부르는 턴이 503 이 되고,
      # 선택지 턴·온톨로지·/health 는 계속 돈다.
      #
      # 웹 데모는 폰 모델이 없어 추출도 서버(Nova)로 돈다. "추출 $0" 전제가 웹에선
      # 깨지고, 심사 기간 한 달을 공개해 두므로 봇 하나면 크레딧이 하루에 빈다.
      #
      # 비우면 무제한이다. 켜졌는지는 /health 의 llm_budget 으로 본다 —
      # null 이면 안 켜진 것이다. 실제로 이 값을 .env 에만 넣고 여기 빠뜨려서
      # 한 번 놓쳤다.
      #
      # 한계: 컨테이너를 재시작하면 카운터가 0 이 된다. 배포할 때마다 리셋되므로
      # 실질 방어선은 AWS 예산 알림($30)이다.
      MEDIMATE_DAILY_BUDGET_USD: ${MEDIMATE_DAILY_BUDGET_USD:-}

      # 하루 소모액을 파일에 적어 둔다. 없으면 메모리라 컨테이너를 다시 올릴 때마다
      # 0 이 됐다 — 오늘만 AI 를 두 번, 백엔드를 다섯 번 올렸다. 개발이 활발한 동안에는
      # 상한이 사실상 안 걸려서, 이중 방어(AWS 예산 알림)의 순서가 뒤집혀 있었다.
      #
      # 아래 ai-state 볼륨에 쓴다. 켜졌는지는 /health 의 llm_budget.persisted 로 본다.
      MEDIMATE_BUDGET_STATE_FILE: ${MEDIMATE_BUDGET_STATE_FILE:-}

      # AI 쪽이 읽는 이름은 AWS_REGION 이 아니라 이것이다.
      # 진료 후 카드의 5번째 축 "지침"(lifestyle_instructions). 약 칸에 섞여 있던
      # 생활 지시(식이·활동·자세)를 따로 뺀다. AI#107 · AI PR#106.
      #
      # 여기 이름이 없으면 .env 에 넣어도 컨테이너에 안 들어간다 — 이 서비스는 env 를
      # 명시 목록으로 받는다. 일일 상한을 그렇게 놓칠 뻔했다.
      #
      # 켜졌는지는 /health.extractor.lifestyle_axis 로 본다.
      #
      # **한 번 켜면 심사 끝까지 유지한다.** 백엔드가 축을 행으로 저장해서, 켜 있던
      # 동안 쌓인 기록에는 그 축이 그대로 남는다. 끄면 새 기록만 예전 모양이 되어
      # 앞뒤 기록의 칸 수가 달라진다.
      MEDIMATE_LIFESTYLE_AXIS: ${MEDIMATE_LIFESTYLE_AXIS:-}

      MEDIMATE_BEDROCK_REGION: ${BEDROCK_REGION:-ap-northeast-2}

      # Lightsail 은 인스턴스에 IAM 역할을 붙일 수 없어 키를 넣는다 —
      # boto3 는 환경변수를 역할과 똑같이 취급하므로 AI 코드는 그대로다.
      #
      # 이 키는 bedrock:InvokeModel 만 가진 전용 사용자(jinryomate-ai-bedrock)의 것이다.
      # apac 추론 프로파일이 아시아 6개 리전으로 분산되므로 정책에 그 리전들의
      # foundation-model ARN 을 전부 넣었다 — 서울만 넣으면 도쿄·싱가포르로
      # 라우팅될 때 AccessDenied 가 난다.
      AWS_REGION: ${BEDROCK_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${BEDROCK_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BEDROCK_SECRET_ACCESS_KEY:-}

      # 되돌릴 때만 쓴다. Bedrock 으로 확정돼 지금은 비어 있다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

    # AI 쪽 실측 RSS 70MB (boto3 +10, Bedrock 클라이언트 +15 가 더해졌다).
    # 2.7배 여유다. 더 조이지 말라는 요청이 있었다.
    mem_limit: 192m
    volumes:
      # 예산 카운터가 배포를 넘어 살아남는 자리. 이것 말고 쓰는 것이 없다.
      - ai-state:/var/lib/medimate
    profiles: ["ai"]   # AI 이미지가 준비되면 --profile ai 로 함께 띄운다.

  # ---------- DB ----------
  # 포트를 호스트에 열지 않는다. 백엔드만 내부망으로 붙는다.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jinryomate}
      POSTGRES_USER: ${POSTGRES_USER:-jinryomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}
    # 2GB 를 넷이 나눠 쓴다. 기본값(shared_buffers 128MB, max_connections 100)이면
    # 연결당 예약분까지 합쳐 예상보다 많이 잡는다. 백엔드 풀이 10 이라 30 이면 넉넉하다.
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=30
      -c work_mem=2MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jinryomate} -d ${POSTGRES_DB:-jinryomate}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 400m

  # 이벤트 대시보드. **한시다** — 심사가 끝나면 analytics 스키마와 함께 지운다.
  #
  # 인터넷에 열지 않는다. 루프백에만 묶고 SSH 터널로 본다 — 지금 밖에서 보이는 것은
  # Caddy 뿐이고, 여기에 로그인 화면을 하나 더 내놓을 이유가 없다.
  grafana:
    image: grafana/grafana-oss:11.6.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # 값이 없으면 컨테이너가 안 뜬다. admin/admin 으로 조용히 열리는 것보다 낫다.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD:?}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    mem_limit: 192m
    depends_on:
      - postgres

volumes:
  grafana-data:
  pgdata:
  ai-state:
  caddy-data:
  caddy-config:
