# 운영 구성. Lightsail 인스턴스 한 대에 전부 올린다.
#
# 이미지는 여기서 빌드하지 않는다. 2GB 서버에서 Gradle 을 돌리면 OOM 으로 죽는다.
# GitHub Actions 가 GHCR 에 올린 것을 pull 만 한다.
#
#   docker compose -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.prod.yml up -d
#
# 비밀값은 같은 디렉터리의 .env 에서 읽는다. 그 파일은 커밋되지 않는다.
name: jinryomate

services:
  # ---------- 진입점 ----------
  # 인터넷에 열리는 유일한 컨테이너다. TLS 를 여기서 끝내고 뒤로는 평문으로 넘긴다.
  # 인증서는 Caddy 가 Let's Encrypt 에서 자동 발급·갱신한다.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"     # ACME 인증과 HTTPS 리다이렉트에 필요하다. 닫으면 인증서 발급이 실패한다.
      - "443:443"
    environment:
      # 예: 1-2-3-4.sslip.io — 그 IP 로 해석되는 공개 호스트명이다.
      PUBLIC_HOST: ${PUBLIC_HOST:?PUBLIC_HOST 가 필요합니다}

    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # 발급받은 인증서. 지우면 재발급 한도에 걸릴 수 있다.
      - caddy-config:/config
    mem_limit: 64m
    depends_on:
      - backend

  # ---------- 백엔드 ----------
  backend:
    image: ghcr.io/medical-mate/backend:latest
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-jinryomate}
      DB_USERNAME: ${POSTGRES_USER:-jinryomate}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 이 필요합니다}

      # 앱 ID 가 없으면 서버가 아예 뜨지 않는다 — 남의 앱 토큰을 걸러내는 방어선이다.
      KAKAO_APP_ID: ${KAKAO_APP_ID:?KAKAO_APP_ID 가 필요합니다}
      KAKAO_ADMIN_KEY: ${KAKAO_ADMIN_KEY:-}

      # 같은 Docker 네트워크 안이라 컨테이너 이름으로 부른다. 인터넷을 타지 않는다.
      AI_BASE_URL: http://ai:8000
      # 양쪽이 같은 값이어야 한다. 비어 있으면 백엔드가 스텁으로 돌고 AI 는 서명 검증을
      # 끈 채 뜬다 — 붙는 시늉을 하다 401 로 터지는 것보다 낫지만, 운영에서는 채워야 한다.
      MEDIMATE_HMAC_SECRET: ${MEDIMATE_HMAC_SECRET:-}

      # 심평원 병원정보서비스. 발급받은 문자열을 그대로 넣는다 — 디코딩해서 넣으면
      # 인증은 통과한 것처럼 보이는데 결과가 0건으로 온다(오류 메시지도 없다).
      # 비어 있으면 백엔드가 고정 목록으로 돈다.
      HIRA_SERVICE_KEY: ${HIRA_SERVICE_KEY:-}

      # Dockerfile 의 -XX:MaxRAMPercentage 는 컨테이너가 여럿이면 계산이 어긋난다.
      # -Xmx 를 명시하면 MaxRAMPercentage 는 무시된다.
      JAVA_TOOL_OPTIONS: "-Xmx320m -XX:MaxMetaspaceSize=128m"
    mem_limit: 640m
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s   # 콜드 스타트가 느리다. 짧게 잡으면 기동 중에 unhealthy 가 된다.

  # ---------- AI ----------
  # 모델 가중치를 들고 있지 않아 GPU 가 필요 없다. 무상태라 볼륨도 DB 도 없다 —
  # 세션 상태는 백엔드가 들고 다닌다.
  #
  # 포트를 열지 않는다. 백엔드만 내부망으로 접근한다.
  #
  # AI 이미지가 준비되기 전에는 띄우지 않아도 된다. 백엔드가 StubAiCardClient 로 동작한다.
  ai:
    image: ${AI_IMAGE:-ghcr.io/medical-mate/ai:latest}
    restart: unless-stopped
    environment:
      # 요청 서명 검증. 비우면 AI 가 검증을 통째로 생략한다.
      MEDIMATE_HMAC_SECRET: ${MEDIMATE_HMAC_SECRET:-}

      # 시크릿이 비면 기동을 실패시킨다.
      #
      # 실제로 한 번 당했다. 시크릿을 빈 채로 배포해 놓고 무검증으로 몇 시간을 돌았는데,
      # 서명 없는 요청을 직접 던져 보기 전까지 아무도 몰랐다. AI 쪽이 기동 경고를
      # 붙여 줬지만 컨테이너 로그를 매번 보지는 않는다.
      #
      # KAKAO_APP_ID 가 없으면 백엔드 기동을 막는 것과 같은 이유다 — 방어선이 조용히
      # 꺼진 채로 멀쩡히 도는 상태를 만들지 않는다.
      MEDIMATE_REQUIRE_HMAC: ${MEDIMATE_REQUIRE_HMAC:-1}

      # Bedrock Nova Pro 를 쓴다. OpenAI 키는 더 이상 필요 없다.
      MEDIMATE_PROVIDER: ${MEDIMATE_PROVIDER:-bedrock}
      MEDIMATE_MODEL: ${MEDIMATE_MODEL:-apac.amazon.nova-pro-v1:0}

      # AI 쪽이 읽는 이름은 AWS_REGION 이 아니라 이것이다.
      MEDIMATE_BEDROCK_REGION: ${BEDROCK_REGION:-ap-northeast-2}

      # Lightsail 은 인스턴스에 IAM 역할을 붙일 수 없어 키를 넣는다 —
      # boto3 는 환경변수를 역할과 똑같이 취급하므로 AI 코드는 그대로다.
      #
      # 이 키는 bedrock:InvokeModel 만 가진 전용 사용자(jinryomate-ai-bedrock)의 것이다.
      # apac 추론 프로파일이 아시아 6개 리전으로 분산되므로 정책에 그 리전들의
      # foundation-model ARN 을 전부 넣었다 — 서울만 넣으면 도쿄·싱가포르로
      # 라우팅될 때 AccessDenied 가 난다.
      AWS_REGION: ${BEDROCK_REGION:-ap-northeast-2}
      AWS_ACCESS_KEY_ID: ${BEDROCK_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${BEDROCK_SECRET_ACCESS_KEY:-}

      # 되돌릴 때만 쓴다. Bedrock 으로 확정돼 지금은 비어 있다.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

    # AI 쪽 실측 RSS 70MB (boto3 +10, Bedrock 클라이언트 +15 가 더해졌다).
    # 2.7배 여유다. 더 조이지 말라는 요청이 있었다.
    mem_limit: 192m
    profiles: ["ai"]   # AI 이미지가 준비되면 --profile ai 로 함께 띄운다.

  # ---------- DB ----------
  # 포트를 호스트에 열지 않는다. 백엔드만 내부망으로 붙는다.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jinryomate}
      POSTGRES_USER: ${POSTGRES_USER:-jinryomate}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 가 필요합니다}
    # 2GB 를 넷이 나눠 쓴다. 기본값(shared_buffers 128MB, max_connections 100)이면
    # 연결당 예약분까지 합쳐 예상보다 많이 잡는다. 백엔드 풀이 10 이라 30 이면 넉넉하다.
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=30
      -c work_mem=2MB
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jinryomate} -d ${POSTGRES_DB:-jinryomate}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 400m

volumes:
  pgdata:
  caddy-data:
  caddy-config:
