# 로컬 개발용 PostgreSQL.  docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    container_name: jinryomate-postgres
    environment:
      POSTGRES_DB: jinryomate
      POSTGRES_USER: jinryomate
      POSTGRES_PASSWORD: local
    ports:
      - "5432:5432"
    volumes:
      - jinryomate-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jinryomate -d jinryomate"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jinryomate-pgdata:
