# Render Blueprint. 대시보드에서 손으로 만드는 대신 이 파일로 서비스를 정의한다.
# 대시보드 클릭은 기록이 남지 않아, 무엇을 어떻게 설정했는지 나중에 알 수 없다.
#
# 쓰는 법: Render > New > Blueprint > 이 저장소 선택.
#
# sync: false 인 값은 여기 적지 않고 대시보드에서 직접 넣는다. 비밀값이라
# 저장소에 들어가면 안 된다.

services:
  - type: web
    name: jinryomate-backend
    runtime: docker
    plan: free
    region: singapore          # 한국에서 가장 가깝다
    dockerfilePath: ./Dockerfile

    # 무료 플랜은 15분 유휴 후 잠들고, 다음 요청에서 다시 뜨는 데 시간이 걸린다.
    # 헬스체크 경로가 있어야 Render 가 기동 완료를 판단한다.
    healthCheckPath: /api/health

    envVars:
      # --- DB. Render Postgres 를 만들면 아래 fromDatabase 가 자동으로 채운다 ---
      - key: DB_HOST
        fromDatabase:
          name: jinryomate-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: jinryomate-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: jinryomate-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: jinryomate-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: jinryomate-db
          property: password

      # --- 비밀값. Render 가 만들어주거나 직접 넣는다 ---

      # 서명 키. generateValue 로 Render 가 무작위 문자열을 만든다.
      # 사람이 정하면 짧거나 예측 가능한 값이 되기 쉽다.
      - key: JWT_SECRET
        generateValue: true

      # 카카오. 대시보드에서 직접 넣는다.
      # APP_ID 가 없으면 서버가 아예 뜨지 않는다 — 남의 앱 토큰을 걸러내는 방어선이다.
      - key: KAKAO_APP_ID
        sync: false
      - key: KAKAO_ADMIN_KEY
        sync: false


      # --- AI 서비스. 배포 위치가 정해지면 채운다 ---
      # 지금은 스텁이라 호출하지 않으므로 비어 있어도 동작한다.
      - key: AI_BASE_URL
        sync: false
      - key: AI_INTERNAL_TOKEN
        sync: false

databases:
  - name: jinryomate-db
    plan: free
    region: singapore
    databaseName: jinryomate
    user: jinryomate
