spring:
  application:
    name: jinryomate-backend

  # Java 21 가상 스레드. AI 호출이 요청당 수 초 걸리는 I/O 대기라,
  # 동시 접속이 몰려도 플랫폼 스레드가 묶이지 않게 한다.
  threads:
    virtual:
      enabled: true

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/jinryomate
    username: jinryomate
    password: local
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 스키마가 확정되기 전까지 update로 간다. 안정되면 Flyway로 고정한다.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

# AI 서비스 연동. 인터페이스 문서 참고.
# 인증 방식은 AI 서비스 배포 위치가 정해지면 확정한다.
ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  internal-token: ${AI_INTERNAL_TOKEN:local-dev-token}
  timeout:
    turn: 30s
    card: 60s

logging:
  pattern:
    # 요청 추적용 requestId를 모든 로그 줄에 붙인다.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    com.jinryomate.backend: DEBUG

# JWT. 시크릿은 환경변수로만 주입한다 (HS256이라 32바이트 이상 필요).
auth:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-please-change-this-32bytes+}
    access-ttl: 1h
    refresh-ttl: 30d

# 카카오. app-id 는 토큰이 우리 앱에서 발급된 것인지 확인하는 데 쓴다.
kakao:
  api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
  app-id: ${KAKAO_APP_ID:}
  admin-key: ${KAKAO_ADMIN_KEY:}
