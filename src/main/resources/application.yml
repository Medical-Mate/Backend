spring:
  application:
    name: jinryomate-backend

  # Java 21 가상 스레드. AI 호출이 요청당 수 초 걸리는 I/O 대기라,
  # 동시 접속이 몰려도 플랫폼 스레드가 묶이지 않게 한다.
  threads:
    virtual:
      enabled: true

  # 파일 업로드를 받지 않는다. 사진 첨부가 와이어프레임에서 빠졌다.
  #
  # 이 블록을 지우면 스프링 부트 기본값으로 되살아난다. 그러면 multipart 요청이 올 때
  # 받을 핸들러가 하나도 없는데도 리졸버가 먼저 파싱해서 임시 파일까지 쓴다.
  # 명시적으로 끈다.
  servlet:
    multipart:
      enabled: false

  # 접속 정보는 전부 환경변수로 받는다. 배포처가 주는 값이 매번 다르고,
  # 여기 박아두면 운영 비밀번호가 저장소에 남는다. 기본값은 로컬 docker-compose 기준이다.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:jinryomate}
    username: ${DB_USERNAME:jinryomate}
    password: ${DB_PASSWORD:local}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # 스키마는 Flyway 가 만든다. 엔티티와 어긋나면 기동 시점에 잡아낸다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    default-property-inclusion: non_null

server:
  # Render 를 비롯한 PaaS 는 붙일 포트를 PORT 로 주입한다. 8080 을 고정하면
  # 컨테이너는 뜨지만 플랫폼이 못 찾아 헬스체크가 실패한다.
  port: ${PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info

# AI 서비스 연동. 인터페이스 문서 참고.
# 인증 방식은 AI 서비스 배포 위치가 정해지면 확정한다.
hospital:
  base-url: ${HIRA_BASE_URL:https://apis.data.go.kr/B551182/hospInfoServicev2}
  # 공공데이터포털이 준 문자열 그대로 넣는다. 디코딩하면 결과가 조용히 0건이 된다.
  service-key: ${HIRA_SERVICE_KEY:}
  timeout: 10s

ai:
  base-url: ${AI_BASE_URL:http://localhost:8000}
  hmac-secret: ${MEDIMATE_HMAC_SECRET:}
  timeout:
    turn: 30s
    card: 60s

logging:
  pattern:
    # 요청 추적용 requestId를 모든 로그 줄에 붙인다.
    console: "%d{HH:mm:ss.SSS} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
  level:
    com.jinryomate.backend: DEBUG

# JWT. 시크릿은 환경변수로만 주입한다 (HS256이라 32바이트 이상 필요).
#
# 기본값을 두지 않는다. 저장소에 있는 문자열로 서명하면 그걸 아는 누구나
# 아무 사용자의 토큰이든 위조할 수 있고, 로그인은 멀쩡히 동작해서 눈치채지 못한다.
# 값이 없으면 기동하지 않는다 (AuthProperties 의 @NotBlank).
# 개발용 값은 application-test.yml · application-local.yml 에 있다.
auth:
  jwt:
    secret: ${JWT_SECRET:}
    access-ttl: 1h
    refresh-ttl: 30d

# 카카오. app-id 는 토큰이 우리 앱에서 발급된 것인지 확인하는 데 쓴다.
kakao:
  api-base-url: ${KAKAO_API_BASE_URL:https://kapi.kakao.com}
  app-id: ${KAKAO_APP_ID:}
  admin-key: ${KAKAO_ADMIN_KEY:}

# API 문서. 운영 포함 모든 환경에서 연다.
#
# 예전에는 개발 프로필에서만 켰다. 앱·AI 담당자가 배포된 서버를 보고 붙어야 하고
# 발표에서도 API 를 보여줘야 해서 운영에서도 연다.
#
# 문서가 열려도 엔드포인트는 여전히 JWT 를 요구한다. 드러나는 것은 어떤 API 가
# 있는지이지 데이터가 아니다. SecurityConfig 의 경로 개방도 같은 기준이다.
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    display-request-duration: true
